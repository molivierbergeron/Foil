# Job quotidien : archive prévu-vs-réalisé (partitions mensuelles append-only)
# et écrase data/forecast.json. Minute creuse volontairement (pas :00).
name: Vérification quotidienne

on:
  schedule:
    - cron: "17 9 * * *"   # 09:17 UTC = 05:17 heure de l'Est (avant la journée)
  workflow_dispatch:

concurrency:
  group: donnees
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python job_quotidien.py
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/verification data/forecast.json
          git diff --cached --quiet && exit 0
          git commit -m "Vérification quotidienne $(date -u +%F)"
          git pull --rebase origin ${GITHUB_REF_NAME} && git push
