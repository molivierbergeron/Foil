# Publie docs/ sur GitHub Pages à chaque changement du dashboard.
# `enablement: true` active Pages automatiquement au premier déploiement.
# Le dossier docs/ reste autonome (chemins relatifs) : copiable tel quel
# par FTP sur un autre hébergement plus tard.
name: Publier le dashboard

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploiement
        uses: actions/deploy-pages@v4
